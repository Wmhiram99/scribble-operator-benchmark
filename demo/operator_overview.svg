<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700">
<rect width="1200" height="700" fill="#f7f8fa"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#1f2937">Scribble perturbation operators — synthetic overview</text>
<text x="600" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#596579">Conceptual illustration only; not a dataset sample or benchmark output</text>
<g font-family="Arial,sans-serif" fill="#1f2937">
<g transform="translate(55,130)"><rect width="520" height="230" rx="16" fill="white" stroke="#d4dbe5"/><text x="24" y="40" font-size="24" font-weight="700">Class</text><text x="24" y="68" font-size="15" fill="#667085">Change a stroke's label; retain its support</text><path d="M75 145 C150 105 210 180 290 128" fill="none" stroke="#2563eb" stroke-width="16" stroke-linecap="round"/><path d="M320 145 C395 105 455 180 500 128" fill="none" stroke="#e5484d" stroke-width="16" stroke-linecap="round"/><text x="92" y="205" font-size="14" fill="#2563eb">label A</text><text x="345" y="205" font-size="14" fill="#e5484d">same support, label B</text></g>
<g transform="translate(625,130)"><rect width="520" height="230" rx="16" fill="white" stroke="#d4dbe5"/><text x="24" y="40" font-size="24" font-weight="700">Offset</text><text x="24" y="68" font-size="15" fill="#667085">Translate stroke components</text><path d="M100 150 C165 115 220 180 285 132" fill="none" stroke="#98a2b3" stroke-width="14" stroke-linecap="round" stroke-dasharray="8 8"/><path d="M205 188 C270 153 325 218 390 170" fill="none" stroke="#7c3aed" stroke-width="16" stroke-linecap="round"/><path d="M220 120 L292 157" stroke="#344054" stroke-width="3" marker-end="url(#arrow)"/><text x="140" y="215" font-size="14" fill="#667085">original</text><text x="330" y="215" font-size="14" fill="#7c3aed">shifted</text></g>
<g transform="translate(55,405)"><rect width="520" height="230" rx="16" fill="white" stroke="#d4dbe5"/><text x="24" y="40" font-size="24" font-weight="700">Direction</text><text x="24" y="68" font-size="15" fill="#667085">Rotate a stroke's principal axis</text><path d="M110 180 L230 115" stroke="#98a2b3" stroke-width="14" stroke-linecap="round" stroke-dasharray="8 8"/><path d="M300 190 L420 100" stroke="#0f9d78" stroke-width="16" stroke-linecap="round"/><path d="M265 180 A70 70 0 0 1 302 123" fill="none" stroke="#344054" stroke-width="3"/><text x="155" y="215" font-size="14" fill="#667085">original axis</text><text x="355" y="215" font-size="14" fill="#0f9d78">rotated</text></g>
<g transform="translate(625,405)"><rect width="520" height="230" rx="16" fill="white" stroke="#d4dbe5"/><text x="24" y="40" font-size="24" font-weight="700">Shrink</text><text x="24" y="68" font-size="15" fill="#667085">Reduce the labeled support along a stroke</text><path d="M80 155 C160 105 240 200 320 135" fill="none" stroke="#98a2b3" stroke-width="24" stroke-linecap="round" stroke-dasharray="8 8"/><path d="M135 155 C195 120 235 170 280 150" fill="none" stroke="#f08c00" stroke-width="16" stroke-linecap="round"/><text x="105" y="215" font-size="14" fill="#667085">original support</text><text x="330" y="215" font-size="14" fill="#f08c00">retained support</text></g>
</g><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#344054"/></marker></defs></svg>
